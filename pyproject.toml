[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bangladesh-climate-risk-intelligence"
version = "1.0.0"
description = "Public code and methodology for Bangladesh Climate & Location Risk Intelligence"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "rasterio>=1.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "networkx>=3.4",
  "requests>=2.32",
  "pyarrow>=17",
  "scipy>=1.14"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
